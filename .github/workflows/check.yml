name: Local-contract and integration checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eventhub-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Create isolated Python environment
        run: |
          python -m venv .venv
          .venv/bin/python scripts/init_env.py
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Real database and broker tests
        run: |
          .venv/bin/python scripts/test_infra.py
          bash scripts/check.sh
      - name: Build and verify fresh product stack
        run: |
          docker compose build api
          .venv/bin/python scripts/fresh_check.py
      - name: Remove only runner-owned test infrastructure
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -f compose.yaml -f compose.dev.yaml down --volumes --remove-orphans
          fi
