[project]
name = "eventhub-replaylab"
version = "0.1.0"
description = "Durable event delivery and reproducible incident replay"
requires-python = ">=3.14"
license = "MIT"
[project.urls]
Repository = "https://github.com/Sasambatra/eventhub-replaylab"
Issues = "https://github.com/Sasambatra/eventhub-replaylab/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and RabbitMQ", "load: explicit load experiment", "replay: prepared receiver scenario"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
